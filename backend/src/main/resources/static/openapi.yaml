openapi: 3.0.3
info:
  title: Lotação Máxima - Sala de Espera API
  version: v1
  description: >-
    API REST para cálculo da lotação máxima simultânea em salas de espera,
    a partir dos tempos de entrada e saída dos passageiros.
servers:
  - url: http://localhost:8080
paths:
  /api/lotacao-maxima:
    post:
      tags:
        - Lotação
      operationId: calcularLotacaoMaxima
      summary: Calcula a lotação máxima simultânea
      description: >-
        Recebe a quantidade de passageiros e suas listas de tempos de entrada e saída e retorna
        o número máximo de passageiros simultâneos na sala. Se alguém entra no
        mesmo instante em que outro sai, conta apenas 1 pessoa naquele instante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotacaoMaximaRequest'
            examples:
              exemplo1:
                summary: Exemplo com lotação máxima 3
                value:
                  quantidadePassageiros: 3
                  temposEntrada: [1, 5, 7]
                  temposSaida: [9, 13, 12]
              exemplo2:
                summary: Exemplo com lotação máxima 1
                value:
                  quantidadePassageiros: 4
                  temposEntrada: [1, 4, 8, 10]
                  temposSaida: [3, 8, 10, 17]
      responses:
        '200':
          description: Cálculo realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotacaoMaximaResponse'
              examples:
                ok:
                  value:
                    maxOcupacao: 3
        '400':
          description: Requisição inválida (validação do payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalido:
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400
                    detail: "Dados inválidos"
                    instance: "/api/lotacao-maxima"
                    timestamp: "2026-01-15T10:30:00Z"
                    details:
                      - "quantidadePassageiros deve estar entre 1 e 100"
                      - "temposEntrada e temposSaida devem ter tamanho quantidadePassageiros"
        '500':
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    LotacaoMaximaRequest:
      type: object
      required: [quantidadePassageiros, temposEntrada, temposSaida]
      additionalProperties: false
      properties:
        quantidadePassageiros:
          type: integer
          minimum: 1
          maximum: 100
          description: Quantidade de passageiros
          example: 3
        temposEntrada:
          type: array
          description: Lista de momentos de entrada (tamanho quantidadePassageiros)
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 1000
          example: [1, 5, 7]
        temposSaida:
          type: array
          description: Lista de momentos de saída (tamanho quantidadePassageiros)
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 1000
          example: [9, 13, 12]
    LotacaoMaximaResponse:
      type: object
      required: [maxOcupacao]
      additionalProperties: false
      properties:
        maxOcupacao:
          type: integer
          minimum: 0
          description: Maior número de passageiros simultâneos observados
          example: 3
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance, timestamp]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica a categoria do problema
          example: "about:blank"
        title:
          type: string
          description: Título resumido do erro
          example: "Bad Request"
        status:
          type: integer
          description: Código HTTP do erro
          example: 400
        detail:
          type: string
          description: Mensagem resumida do erro
          example: "Dados inválidos"
        instance:
          type: string
          format: uri-reference
          description: Caminho da requisição que gerou o erro
          example: "/api/lotacao-maxima"
        timestamp:
          type: string
          format: date-time
          description: Momento em que o erro foi gerado
          example: "2026-01-15T10:30:00Z"
        details:
          type: array
          description: Lista de detalhes do erro (quando aplicável)
          items:
            type: string
          example:
            - "temposEntrada e temposSaida devem ter tamanho quantidadePassageiros"
